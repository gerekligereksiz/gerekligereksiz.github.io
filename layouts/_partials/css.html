{{- /* Üretimde 100 KB'tan küçük (ham; gzip ≈ 13 KB) CSS <head> içine gömülür: render-blocking istek
       (mobilde ek bir gidiş-dönüş) ortadan kalkar. CSP için scripts/csp.mjs
       satır içi <style>'ı sha256 ile izinler. Büyürse otomatik <link>'e döner;
       geliştirmede her zaman <link>. */ -}}
{{ with resources.Get "css/main.css" }}
  {{ $opts := dict "minify" (not hugo.IsDevelopment) }}
  {{ with . | css.TailwindCSS $opts }}
    {{ if hugo.IsDevelopment }}
      <link rel="stylesheet" href="{{ .RelPermalink }}">
    {{ else }}
      {{ with . | fingerprint }}
        {{ if lt (len .Content) 100000 }}
          <style>{{ .Content | safeCSS }}</style>
        {{ else }}
          <link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous">
        {{ end }}
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
