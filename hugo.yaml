baseURL: https://gerekli-gereksiz.com/
locale: tr
title: Gerekli Gereksiz

taxonomies:
  category: categories
  tag: tags
  platform: platforms
  developer: developers

# Menü hedefleri pageRef ile verilir: URL'yi Hugo üretir (baseURL alt yolu
# dahil) ve IsMenuCurrent/HasMenuCurrent sayfa nesnesi üzerinden çalışır, yani
# aktif menü vurgusu doğru olur. url: ile birlikte yazma, url kazanır.
# Hedef sayfa yoksa build hata verir (sessiz 404 yerine erken uyarı).
menu:
  main:
    - name: Yazılar
      pageRef: /yazilar
      weight: 10
    - name: Bülten
      pageRef: /bulten
      weight: 20
    # Uygulamalar ve Oyunlar menüden gizli (bölümler yayında kalıyor, sadece
    # navigasyonda görünmüyor). Tekrar göstermek için yorumu kaldır.
    # - name: Uygulamalar
    #   pageRef: /uygulamalar
    #   weight: 30
    # - name: Oyunlar
    #   pageRef: /oyunlar
    #   weight: 35
  footer:
    - name: Hakkımızda
      pageRef: /hakkimizda
      weight: 10
    - name: Bize Ulaşın
      pageRef: /bize-ulasin
      weight: 20
    # Uygulamalar menüden gizli (bölüm yayında kalıyor).
    # - name: Uygulamalar
    #   pageRef: /uygulamalar
    #   weight: 30
    - name: Veri Kaynakları
      pageRef: /veri-kaynaklari
      weight: 40
  other:
    - name: Sporcular
      pageRef: /sporcular
      weight: 10
    - name: Takımlar
      pageRef: /takimlar
      weight: 15
    - name: Uygulama İncelemeleri
      pageRef: /uygulama-incelemeleri
      weight: 20
    # Barajlar menüden gizli (bölüm yayında kalıyor).
    # - name: Barajlar
    #   pageRef: /baraj
    #   weight: 30
  legal:
    - name: Gizlilik Politikası
      pageRef: /gizlilik-politikasi
      weight: 10
    - name: Çerez Politikası
      pageRef: /cerez-politikasi
      weight: 20
    - name: KVKK Aydınlatma Metni
      pageRef: /kvkk-aydinlatma-metni
      weight: 30
    - name: Kullanım Şartları
      pageRef: /kullanim-sartlari
      weight: 40

params:
  description: "Uygulama kataloğu, teknoloji yazıları, haftalık bülten, Türk sporcu başarıları ve baraj doluluk verileri."
  # Harici bağlantılarda kullanılan rel değeri (tüm şablonlar buradan okur).
  # nofollow: link değeri aktarımını keser. Tek link için ext-link 3. parametreyle override edilebilir.
  externalLinkRel: "noopener noreferrer nofollow"
  # İçerik lisansı. Footer ve Kullanım Şartları buradan okur.
  license: "CC BY-NC-ND 4.0"
  licenseUrl: "https://creativecommons.org/licenses/by-nc-nd/4.0/deed.tr"
  # Tek iletişim kanalı. Adres değişince yalnızca burayı güncelle
  # (bize-ulasin.md ve kvkk-aydinlatma-metni.md iletisim-eposta shortcode'unu kullanır).
  contactEmail: "iletisim@gerekligereksiz.example"

  # Çerez onayı. Kategoriler buradan yönetilir, kod değişikliği gerekmez.
  # Bakım:
  #   kategori kapat    -> enabled: false
  #   alt kategori ekle -> grubun categories listesine kayıt
  #   yeni grup ekle    -> categories içeren üst seviye kayıt
  #   izin kapatılamaz  -> required: true (yalnızca izin biriminde)
  #   şema değişti      -> version'ı 1 artır (eski kayıtlar tarayıcıda silinir)
  # id = kayıttaki alan adı; kayıt yolu id'lerden türetilir:
  #   analytics           -> preferences.analytics
  #   thirdParty.youtube  -> preferences.thirdParty.youtube
  # id değiştirirsen kayıt anahtarı değişir: version'ı da artır.
  # En fazla 2 seviye: grup (categories taşır, switch'i yoktur) + alt kategori.
  consent:
    version: 1
    banner:
      title: "Gizliliğinize önem veriyoruz"
      text: "Deneyiminizi iyileştirmek ve trafiği analiz etmek için çerez kullanıyoruz. \"Tümünü kabul et\" seçeneğine tıklayarak çerez kullanımımıza izin vermiş olursunuz."
      links:
        - label: "Gizlilik politikası"
          href: "/gizlilik-politikasi/"
        - label: "Çerez politikası"
          href: "/cerez-politikasi/"
    categories:
      - id: necessary
        label: Gerekli
        enabled: true
        required: true
        description: "Tercihinizi ve bülten okuma ilerlemenizi hatırlar; kapatılamaz. Çerez kullanmaz."
        cookies: []
      - id: analytics
        label: Analitik
        enabled: true
        description: "Google Analytics 4 ile site kullanımını ölçer. IP adresiniz iletilir, kalıcı olarak saklanmaz."
        cookies: ["_ga", "_ga_*"]
      - id: thirdParty
        label: Üçüncü taraf
        enabled: true
        categories:
          - id: youtube
            label: YouTube
            enabled: true
            description: "YouTube embed video. İzin verdiğinizde video gizlilik geliştirilmiş modda (youtube-nocookie.com) yüklenir; sadece IP adresiniz iletilir."
            cookies: []

# Google Analytics 4. ID boşken analitik yüklenmez; "Analitik" kategorisi
# yine görünür ve seçim kaydedilir, ancak hiçbir istek gönderilmez.
# ID doldurulduğunda GA yalnızca "Tümünü kabul et" / Analitik izni sonrası çalışır.
services:
  googleAnalytics:
    ID: "GTM-PGT9R4V6"

privacy:
  youtube:
    privacyEnhanced: true

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: '(postcss|tailwind)\.config\.js'
      target: css

module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'
