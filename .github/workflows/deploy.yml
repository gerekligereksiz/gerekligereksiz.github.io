name: Deploy to GitHub Pages

# Bu dosya, depo kökünde olacak şekilde tasarlandı:
#   gerekligereksiz/gerekligereksiz.github.io/.github/workflows/deploy.yml
# Hugo projesinin kökü ile depo kökü aynı olduğu varsayılır (package.json,
# hugo.yaml ve public/ depo kökündedir).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deploy'ları sırayla çalışır; yarım kalan yayın bırakmamak için iptal yok.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: '0.169.0'
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # İleride enableGitInfo açılırsa .GitInfo/.Lastmod için geçmiş gerekir.
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Tailwind CSS v4, Hugo'nun css.TailwindCSS fonksiyonu içinde derlenir;
      # node_modules olmadan build başarısız olur.
      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # baseURL, Pages ayarlarından okunur: şu an gerekligereksiz.github.io,
      # custom domain tanımlanınca otomatik olarak o adres kullanılır.
      # hugo.yaml'daki baseURL üretim adresidir, yerel build'ler onu kullanır.
      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
